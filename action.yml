name: Build Zenith Apps for GitHub Pages
description: Build the Zenith Apps submodule and copy it into a parent Pages artifact.

inputs:
  output-directory:
    description: Destination inside the parent Pages artifact.
    required: true
  node-version:
    description: Node.js version used for the build.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm test
        npm run lint
        npm run build:pages
    - shell: bash
      env:
        ZENITH_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        destination="$ZENITH_OUTPUT_DIRECTORY"
        if [[ "$destination" != /* ]]; then destination="$GITHUB_WORKSPACE/$destination"; fi
        mkdir -p "$destination"
        cp -a "$GITHUB_ACTION_PATH/dist/." "$destination/"
